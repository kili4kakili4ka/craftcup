<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Меню — CraftCup</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">
    <img src="images/logo.png" alt="CraftCup"><span>CraftCup</span>
  </a>
  <nav class="nav">
    <a href="menu.html">Меню</a>
    <a href="constructor.html">Конструктор</a>
    <a href="about.html">О кофейне</a>
  </nav>
  <div class="header-icons">
    <a href="cart.html" class="icon-btn" title="Корзина">
      <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 016 0v2"/></svg>
      <span class="cart-count"></span>
    </a>
    <button class="icon-btn" data-profile-btn title="Личный кабинет">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="container" id="menuRoot"></main>

<footer class="footer">
  <hr>
  <p class="footer-text">CraftCup © 2026</p>
</footer>

<!-- МОДАЛКА НАПИТКА -->
<!-- МОДАЛКА НАПИТКА -->
<div class="modal-overlay" id="drinkModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('drinkModal')">×</button>
    <img id="dm-img" class="drink-img" src="" alt="">
    <h3 id="dm-name"></h3>
    <p class="description" id="dm-desc"></p>

    <!-- Блок выбора объёма (показывается только для напитков "от") -->
    <div id="dm-volume-block" style="display:none; margin-bottom:20px;">
      <div style="font-size:15px; color:var(--text-soft); margin-bottom:10px;">
        Выберите объём:
      </div>
      <div class="volume-options" id="dm-volumes"></div>
    </div>

    <span class="modal-price" id="dm-price"></span>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeModal('drinkModal')">Закрыть</button>
      <button class="btn btn-sm" id="dm-add">В корзину</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА АВТОРИЗАЦИИ -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('authModal')">×</button>
    <h3>Вход в CraftCup</h3>
    <h4>Введите телефон и имя</h4>
    <form id="authForm">
      <input type="tel" id="authPhone" class="modal-input" placeholder="Номер телефона" required>
      <input type="text" id="authName" class="modal-input" placeholder="Имя" required>
      <div class="modal-actions">
        <button type="submit" class="btn btn-sm">Войти</button>
      </div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>

<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
