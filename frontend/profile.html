<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Личный кабинет — CraftCup</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="logo">
    <img src="images/logo.png" alt="CraftCup"><span>CraftCup</span>
  </a>
  <nav class="nav">
    <a href="menu.html">Меню</a>
    <a href="constructor.html">Конструктор</a>
    <a href="about.html">О кофейне</a>
  </nav>
  <div class="header-icons">
    <a href="cart.html" class="icon-btn">
      <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7V5a3 3 0 016 0v2"/></svg>
      <span class="cart-count"></span>
    </a>
    <button class="icon-btn" data-profile-btn>
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
    </button>
    <button class="burger"><span></span><span></span><span></span></button>
  </div>
</header>

<main class="container profile-page" id="profileRoot">
  <section class="profile-block">
    <h2>Личные данные</h2>
    <div class="field">
      <label>Номер телефона:</label>
      <span data-user-phone>—</span>
    </div>
    <div class="field">
      <label>Имя:</label>
      <input type="text" id="profileName" value="" placeholder="Имя">
    </div>
    <button class="btn btn-sm" id="saveProfile">Сохранить</button>
  </section>

  <hr class="divider">

  <section class="profile-block">
    <h2>Привязанные карты</h2>
    <div class="cards-list" id="cardsList"></div>
    <button class="btn btn-sm" id="addCardBtn" style="width:100%;">Добавить карту</button>
  </section>

  <hr class="divider">

  <div style="text-align:center;">
    <button class="btn btn-sm" id="logoutBtn">Выйти</button>
  </div>
</main>

<footer class="footer">
  <hr>
  <p class="footer-text">CraftCup © 2026</p>
</footer>

<!-- МОДАЛКА ДОБАВЛЕНИЯ КАРТЫ -->
<div class="modal-overlay" id="cardModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('cardModal')">×</button>
    <h3>Новая карта</h3>
    <h4>Введите данные карты</h4>
    <input type="text" id="cardNumber" class="modal-input"
           placeholder="0000 0000 0000 0000" maxlength="19" inputmode="numeric">
    <div class="card-form-row">
      <input type="text" id="cardExpiry" class="modal-input"
             placeholder="ММ/ГГ" maxlength="5" inputmode="numeric">
      <input type="text" id="cardName" class="modal-input"
             placeholder="Имя владельца">
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline btn-sm" onclick="closeModal('cardModal')">Отмена</button>
      <button class="btn btn-sm" id="saveCardBtn">Добавить</button>
    </div>
  </div>
</div>

<!-- АВТОРИЗАЦИЯ -->
<div class="modal-overlay" id="authModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('authModal')">×</button>
    <h3>Вход в CraftCup</h3>
    <h4>Введите телефон и имя</h4>
    <form id="authForm">
      <input type="tel" id="authPhone" class="modal-input" placeholder="Номер телефона" required>
      <input type="text" id="authName" class="modal-input" placeholder="Имя" required>
      <div class="modal-actions"><button class="btn btn-sm" type="submit">Войти</button></div>
    </form>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/menu.js"></script>
</body>
</html>

<script src="js/main.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
